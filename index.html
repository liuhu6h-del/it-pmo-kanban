<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT PMO Kanban</title>
  <style>
    /* =========================================================
       Design tokens: palette, spacing scale, type
       ========================================================= */
    :root {
      --blue-900: #0b2545;
      --blue-800: #12355b;
      --blue-700: #1d4f91;
      --blue-600: #2563b0;
      --blue-500: #3b7dd8;
      --blue-100: #e6effa;
      --blue-50:  #f3f7fc;

      --grey-900: #1c2430;
      --grey-700: #46505e;
      --grey-500: #7a8494;
      --grey-300: #c9d0da;
      --grey-200: #e2e6ec;
      --grey-100: #f1f3f6;
      --white:    #ffffff;

      --prio-critical: #c62828;
      --prio-high:     #d98200;
      --prio-medium:   #2563b0;
      --prio-low:      #7a8494;

      --danger-bg:  #fdecec;
      --danger-fg:  #a61b1b;
      --success-bg: #e8f5ec;
      --success-fg: #1e6b38;
      --warning-bg: #fff4e0;
      --warning-fg: #8a5300;

      --focus-ring: #f2b705;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;

      --shadow-card: 0 1px 2px rgba(11, 37, 69, 0.08), 0 1px 3px rgba(11, 37, 69, 0.06);
      --shadow-pop:  0 10px 30px rgba(11, 37, 69, 0.25);

      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* =========================================================
       Base
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.45;
      color: var(--grey-900);
      background: var(--grey-100);
    }

    h1, h2, h3, p { margin: 0; }

    button, input, select, textarea { font: inherit; color: inherit; }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* =========================================================
       Buttons
       ========================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
      background: var(--white);
      color: var(--blue-800);
    }
    .btn-primary { background: var(--blue-600); color: var(--white); }
    .btn-primary:hover { background: var(--blue-700); }
    .btn-primary:disabled { background: var(--grey-500); cursor: progress; }
    .btn-light { background: var(--white); color: var(--blue-800); }
    .btn-light:hover { background: var(--blue-100); }
    .btn-ghost { background: transparent; border-color: var(--grey-300); color: var(--grey-700); }
    .btn-ghost:hover { background: var(--grey-100); }

    /* =========================================================
       Header: wordmark, summary strip, add button
       ========================================================= */
    .app-header {
      background: linear-gradient(90deg, var(--blue-900), var(--blue-700));
      color: var(--white);
      padding: var(--space-4) var(--space-5);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-4) var(--space-5);
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .wordmark small {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0;
      opacity: 0.8;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin: 0;
      padding: 0;
      list-style: none;
      flex: 1 1 auto;
    }
    .summary li {
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      padding: var(--space-1) var(--space-3);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .summary strong { font-size: 1rem; margin-left: var(--space-1); }
    .summary .summary-overdue { background: rgba(198, 40, 40, 0.85); }

    .demo-note {
      background: var(--blue-50);
      border-bottom: 1px solid var(--blue-100);
      color: var(--blue-800);
      font-size: 0.85rem;
      padding: var(--space-2) var(--space-5);
    }

    /* =========================================================
       Filter bar
       ========================================================= */
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: var(--space-3) var(--space-4);
      padding: var(--space-4) var(--space-5);
      background: var(--white);
      border-bottom: 1px solid var(--grey-200);
    }
    .filters h2 { width: 100%; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey-700); }
    .filter-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 180px; }
    .filter-field label { font-size: 0.8rem; font-weight: 600; color: var(--grey-700); }

    .input, .filter-field input, .filter-field select {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--grey-300);
      border-radius: var(--radius-sm);
      background: var(--white);
      min-height: 38px;
    }
    .filter-status { font-size: 0.85rem; color: var(--grey-700); margin-left: auto; align-self: center; }

    /* =========================================================
       Board and columns
       ========================================================= */
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-4);
      padding: var(--space-5);
      align-items: start;
    }

    .column {
      background: var(--grey-200);
      border: 2px dashed transparent;
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      min-height: 240px;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .column.drop-target {
      background: var(--blue-100);
      border-color: var(--blue-500);
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-1) var(--space-2) var(--space-3);
    }
    .column-header h2 { font-size: 0.95rem; color: var(--blue-900); }
    .column-desc { font-size: 0.75rem; color: var(--grey-700); padding: 0 var(--space-2) var(--space-3); }
    .count-badge {
      min-width: 28px;
      text-align: center;
      background: var(--blue-800);
      color: var(--white);
      border-radius: 999px;
      padding: 2px var(--space-2);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .card-list { display: flex; flex-direction: column; gap: var(--space-3); min-height: 60px; }
    .empty { font-size: 0.85rem; color: var(--grey-500); text-align: center; padding: var(--space-4) 0; }

    /* =========================================================
       Cards
       ========================================================= */
    .card {
      background: var(--white);
      border-radius: var(--radius-md);
      border-left: 6px solid var(--prio-medium);
      box-shadow: var(--shadow-card);
      padding: var(--space-3);
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .card.dragging { opacity: 0.45; }
    .card.prio-critical { border-left-color: var(--prio-critical); }
    .card.prio-high     { border-left-color: var(--prio-high); }
    .card.prio-medium   { border-left-color: var(--prio-medium); }
    .card.prio-low      { border-left-color: var(--prio-low); }

    .card-top { display: flex; align-items: center; gap: var(--space-2); }
    .card-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--grey-700); }
    .card-title { font-size: 0.95rem; line-height: 1.3; word-break: break-word; }
    .card-project { font-size: 0.8rem; color: var(--blue-700); font-weight: 600; }

    .card-meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px var(--space-2);
      margin: 0;
      font-size: 0.8rem;
    }
    .card-meta dt { color: var(--grey-500); }
    .card-meta dd { margin: 0; word-break: break-word; }

    .card-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); }

    .pill, .tag, .badge-overdue {
      display: inline-block;
      border-radius: 999px;
      padding: 1px var(--space-2);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.6;
    }
    .pill-critical { background: var(--prio-critical); color: var(--white); }
    .pill-high     { background: var(--prio-high); color: var(--grey-900); }
    .pill-medium   { background: var(--prio-medium); color: var(--white); }
    .pill-low      { background: var(--grey-200); color: var(--grey-900); }
    .tag { background: var(--blue-50); color: var(--blue-800); border: 1px solid var(--blue-100); font-weight: 600; }
    .badge-overdue { background: var(--danger-bg); color: var(--danger-fg); border: 1px solid #f3c2c2; }

    .icon-btn {
      margin-left: auto;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--grey-500);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--danger-bg); color: var(--danger-fg); }

    .card-actions { display: flex; gap: var(--space-2); }
    .btn-small {
      padding: 2px var(--space-2);
      font-size: 0.78rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--grey-300);
      background: var(--white);
      color: var(--blue-800);
      font-weight: 600;
      cursor: pointer;
    }
    .btn-small:hover { background: var(--blue-50); }
    .btn-small.danger { background: var(--prio-critical); border-color: var(--prio-critical); color: var(--white); }

    .move-menu, .delete-confirm {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-2);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
    }
    .move-menu { background: var(--blue-50); }
    .delete-confirm { background: var(--danger-bg); color: var(--danger-fg); font-weight: 600; }

    /* =========================================================
       Add Task modal
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 37, 69, 0.55);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: var(--space-6) var(--space-4);
      overflow-y: auto;
      z-index: 50;
    }
    .modal-backdrop[hidden] { display: none; }

    .modal {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
      width: 100%;
      max-width: 620px;
      padding: var(--space-5);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
    .modal-head h2 { font-size: 1.2rem; color: var(--blue-900); }
    .modal-head .icon-btn { margin-left: 0; }
    .modal-head .icon-btn:hover { background: var(--grey-100); color: var(--grey-900); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
    .field { display: flex; flex-direction: column; gap: var(--space-1); }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 0.85rem; font-weight: 600; color: var(--grey-700); }
    .field .req { color: var(--danger-fg); }
    .field input, .field select, .field textarea {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--grey-300);
      border-radius: var(--radius-sm);
      background: var(--white);
      min-height: 38px;
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field [aria-invalid="true"] { border-color: var(--prio-critical); background: #fffafa; }
    .field-hint { font-size: 0.75rem; color: var(--grey-500); }
    .field-error { font-size: 0.8rem; color: var(--danger-fg); min-height: 1em; }
    .field-error:empty { display: none; }

    .form-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); }

    /* =========================================================
       Toasts
       ========================================================= */
    .toast-region {
      position: fixed;
      right: var(--space-4);
      bottom: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      z-index: 100;
      max-width: min(380px, calc(100vw - 2 * var(--space-4)));
    }
    .toast {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-pop);
      font-size: 0.9rem;
      font-weight: 600;
      border-left: 5px solid;
    }
    .toast-success { background: var(--success-bg); color: var(--success-fg); border-color: var(--success-fg); }
    .toast-warning { background: var(--warning-bg); color: var(--warning-fg); border-color: var(--prio-high); }
    .toast-info    { background: var(--blue-50); color: var(--blue-800); border-color: var(--blue-600); }

    /* =========================================================
       Responsive: stack columns below 768px
       ========================================================= */
    @media (max-width: 1100px) and (min-width: 768px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 767px) {
      .app-header, .filters, .board, .demo-note { padding-left: var(--space-4); padding-right: var(--space-4); }
      .board { grid-template-columns: 1fr; }
      .filter-field { min-width: 0; flex: 1 1 100%; }
      .filter-status { margin-left: 0; }
      .form-grid { grid-template-columns: 1fr; }
      .modal { padding: var(--space-4); }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       Header: text wordmark, live summary strip, Add Task button
       ========================================================= -->
  <header class="app-header">
    <div class="wordmark">IT PMO <small>Project Board · Training Demo</small></div>
    <ul class="summary" id="summary" aria-label="Board summary"></ul>
    <button type="button" class="btn btn-light" id="open-add">
      <span aria-hidden="true">+</span> Add Task
    </button>
  </header>

  <p class="demo-note" role="note">
    <span aria-hidden="true">ⓘ</span>
    Demo only. Board data is held in memory. Refreshing the page resets it to the sample tasks.
  </p>

  <!-- =========================================================
       Filter bar
       ========================================================= -->
  <section class="filters" aria-labelledby="filters-heading">
    <h2 id="filters-heading">Filter tasks</h2>
    <div class="filter-field">
      <label for="filter-project">Project / Workstream</label>
      <select id="filter-project">
        <option value="">All projects</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="filter-assignee">Assignee contains</label>
      <input id="filter-assignee" type="search" placeholder="e.g. Tan" autocomplete="off">
    </div>
    <div class="filter-field">
      <label for="filter-priority">Priority</label>
      <select id="filter-priority">
        <option value="">All priorities</option>
      </select>
    </div>
    <button type="button" class="btn btn-ghost" id="clear-filters">Clear filters</button>
    <p class="filter-status" id="filter-status" aria-live="polite"></p>
  </section>

  <!-- =========================================================
       Kanban board: columns are filled by renderBoard()
       ========================================================= -->
  <main class="board" id="board" aria-label="Kanban board"></main>

  <!-- =========================================================
       Add Task modal
       ========================================================= -->
  <div class="modal-backdrop" id="add-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
      <div class="modal-head">
        <h2 id="add-title">Add Task</h2>
        <button type="button" class="icon-btn" id="close-add" aria-label="Close Add Task dialog">×</button>
      </div>

      <form id="add-form" novalidate>
        <div class="form-grid">
          <div class="field full">
            <label for="f-title">Task Title <span class="req" aria-hidden="true">*</span></label>
            <input id="f-title" name="title" type="text" maxlength="80" required aria-describedby="f-title-error">
            <p class="field-error" id="f-title-error"></p>
          </div>

          <div class="field full">
            <label for="f-description">Description</label>
            <textarea id="f-description" name="description" maxlength="500" aria-describedby="f-description-hint f-description-error"></textarea>
            <span class="field-hint" id="f-description-hint">Optional, up to 500 characters.</span>
            <p class="field-error" id="f-description-error"></p>
          </div>

          <div class="field">
            <label for="f-project">Project / Workstream</label>
            <select id="f-project" name="project" aria-describedby="f-project-error"></select>
            <p class="field-error" id="f-project-error"></p>
          </div>

          <div class="field">
            <label for="f-category">Category</label>
            <select id="f-category" name="category" aria-describedby="f-category-error"></select>
            <p class="field-error" id="f-category-error"></p>
          </div>

          <div class="field">
            <label for="f-assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
            <input id="f-assignee" name="assignee" type="text" maxlength="60" required autocomplete="off" aria-describedby="f-assignee-error">
            <p class="field-error" id="f-assignee-error"></p>
          </div>

          <div class="field">
            <label for="f-priority">Priority</label>
            <select id="f-priority" name="priority"></select>
          </div>

          <div class="field">
            <label for="f-dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
            <input id="f-dueDate" name="dueDate" type="date" required aria-describedby="f-dueDate-error">
            <p class="field-error" id="f-dueDate-error"></p>
          </div>

          <div class="field">
            <label for="f-status">Status</label>
            <select id="f-status" name="status"></select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancel-add">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-add">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notifications (announced politely to screen readers) -->
  <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <!--
    FormSubmit setup (one-time activation):
    FormSubmit needs each destination address activated once. The first submission
    to a new address does not deliver. Instead, FormSubmit emails a confirmation
    link to that address. Submissions only start arriving after someone clicks the
    link in that email. Set the address in FORMSUBMIT_ENDPOINT below.
  -->
  <script>
    "use strict";

    /* =========================================================
       CONFIG: change the email address here (one place only)
       ========================================================= */
    const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
    const NOTIFY_TIMEOUT_MS = 15000;

    /* =========================================================
       Reference data
       ========================================================= */
    const STATUSES = [
      { key: "Backlog",     desc: "Logged, not yet scheduled" },
      { key: "In Progress", desc: "Actively being worked" },
      { key: "Blocked",     desc: "Waiting on a dependency, vendor or approval" },
      { key: "Done",        desc: "Completed / closed" },
    ];
    const PROJECTS = [
      "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
      "Data & Analytics", "Infrastructure & Cloud", "Vendor Management",
    ];
    const CATEGORIES = [
      "Application Development", "Infrastructure", "Cybersecurity",
      "Data", "Compliance", "Vendor",
    ];
    const PRIORITIES = ["Critical", "High", "Medium", "Low"];

    /* =========================================================
       State: the single source of truth (in memory only)
       ========================================================= */
    const state = {
      tasks: [],
      filters: { project: "", assignee: "", priority: "" },
      ui: {
        openMoveId: null,      // card whose "Move ▸" menu is open
        pendingDeleteId: null, // card showing "Delete? Yes / No"
        focusAfterRender: null // { id, action } to restore keyboard focus
      },
      nextId: 1,
      sending: false,
    };

    /* =========================================================
       Helpers
       ========================================================= */
    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatId(n) {
      return "UOB-ITPM-" + String(n).padStart(4, "0");
    }

    // Local-date ISO string (YYYY-MM-DD). toISOString() would use UTC and can be off by a day.
    function toLocalISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function todayISO() {
      return toLocalISO(new Date());
    }

    function addDays(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return toLocalISO(d);
    }

    function formatDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-GB", {
        day: "2-digit", month: "short", year: "numeric",
      });
    }

    function isOverdue(task) {
      return task.status !== "Done" && task.dueDate < todayISO();
    }

    function slug(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, "-");
    }

    function fillSelect(select, values, selected) {
      select.innerHTML = values
        .map((v) => `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`)
        .join("");
    }

    function appendOptions(select, values) {
      select.insertAdjacentHTML(
        "beforeend",
        values.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("")
      );
    }

    /* =========================================================
       Seed data: 8 demo tasks, dates relative to today
       ========================================================= */
    function seedTasks() {
      const seeds = [
        { title: "Migrate FX pricing service to AWS", description: "Lift-and-shift the FX rate pricing microservice to the AWS landing zone with blue/green cutover.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Priya Raman", priority: "High", dueDate: addDays(21), status: "In Progress" },
        { title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Apply vendor hotfix to all branch teller virtual desktops. Needs change window approval.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Marcus Tan", priority: "Critical", dueDate: addDays(-2), status: "Blocked" },
        { title: "UAT sign-off for mobile onboarding release 4.2", description: "Collect business UAT sign-off for eKYC onboarding flow before production release.", project: "Digital Channels", category: "Application Development", assignee: "Aisha Rahman", priority: "High", dueDate: addDays(5), status: "In Progress" },
        { title: "Renew core banking vendor support contract", description: "Negotiate 3-year support renewal and SLA credits with core banking vendor.", project: "Vendor Management", category: "Vendor", assignee: "Daniel Lim", priority: "Medium", dueDate: addDays(30), status: "Backlog" },
        { title: "SWIFT CSP annual attestation", description: "Complete Customer Security Programme self-attestation and independent assessment evidence.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Grace Ong", priority: "Critical", dueDate: addDays(-5), status: "In Progress" },
        { title: "Build regulatory liquidity data mart", description: "Model LCR/NSFR source feeds into the analytics warehouse for automated reporting.", project: "Data & Analytics", category: "Data", assignee: "Kenji Watanabe", priority: "Medium", dueDate: addDays(45), status: "Backlog" },
        { title: "Core ledger batch performance tuning", description: "Reduce end-of-day batch window by 20% ahead of the core banking upgrade.", project: "Core Banking Upgrade", category: "Application Development", assignee: "Priya Raman", priority: "Low", dueDate: addDays(60), status: "Backlog" },
        { title: "Decommission legacy internet banking servers", description: "Retire old web tier after traffic cutover; wipe and dispose hardware per policy.", project: "Digital Channels", category: "Infrastructure", assignee: "Marcus Tan", priority: "Low", dueDate: addDays(-10), status: "Done" },
      ];
      state.tasks = seeds.map((s) => ({ id: formatId(state.nextId++), ...s }));
    }

    /* =========================================================
       Filtering (pure, over the in-memory array)
       ========================================================= */
    function applyFilters(tasks) {
      const { project, assignee, priority } = state.filters;
      const needle = assignee.trim().toLowerCase();
      return tasks.filter((t) =>
        (!project || t.project === project) &&
        (!priority || t.priority === priority) &&
        (!needle || t.assignee.toLowerCase().includes(needle))
      );
    }

    function hasActiveFilters() {
      const f = state.filters;
      return Boolean(f.project || f.priority || f.assignee.trim());
    }

    /* =========================================================
       Rendering
       ========================================================= */
    function renderCard(task) {
      const id = escapeHtml(task.id);
      const prio = task.priority.toLowerCase();
      const titleId = "title-" + id;
      const isMoveOpen = state.ui.openMoveId === task.id;
      const isDeletePending = state.ui.pendingDeleteId === task.id;

      const overdue = isOverdue(task)
        ? `<span class="badge-overdue"><span aria-hidden="true">⚠ </span>Overdue</span>`
        : "";

      const moveMenu = isMoveOpen
        ? `<div class="move-menu" role="group" aria-label="Move ${id} to column">
             <span>Move to:</span>
             ${STATUSES.filter((s) => s.key !== task.status).map((s) =>
               `<button type="button" class="btn-small" data-action="move" data-status="${escapeHtml(s.key)}">${escapeHtml(s.key)}</button>`
             ).join("")}
             <button type="button" class="btn-small" data-action="close-move">Cancel</button>
           </div>`
        : "";

      const deleteConfirm = isDeletePending
        ? `<div class="delete-confirm" role="group" aria-label="Confirm delete ${id}">
             <span>Delete?</span>
             <button type="button" class="btn-small danger" data-action="confirm-delete">Yes</button>
             <button type="button" class="btn-small" data-action="cancel-delete">No</button>
           </div>`
        : "";

      return `
        <article class="card prio-${prio}" draggable="true" data-id="${id}" aria-labelledby="${titleId}">
          <div class="card-top">
            <span class="card-id">${id}</span>
            ${overdue}
            <button type="button" class="icon-btn" data-action="delete" aria-label="Delete task ${id}">×</button>
          </div>
          <h3 class="card-title" id="${titleId}">${escapeHtml(task.title)}</h3>
          <p class="card-project">${escapeHtml(task.project)}</p>
          <dl class="card-meta">
            <dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd>
            <dt>Due</dt><dd><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd>
          </dl>
          <div class="card-tags">
            <span class="pill pill-${prio}">${escapeHtml(task.priority)}</span>
            <span class="tag">${escapeHtml(task.category)}</span>
          </div>
          <div class="card-actions">
            <button type="button" class="btn-small" data-action="toggle-move" aria-expanded="${isMoveOpen}">Move ▸</button>
          </div>
          ${moveMenu}
          ${deleteConfirm}
        </article>`;
    }

    function renderSummary() {
      const counts = Object.fromEntries(STATUSES.map((s) => [s.key, 0]));
      let overdue = 0;
      state.tasks.forEach((t) => {
        counts[t.status] += 1;
        if (isOverdue(t)) overdue += 1;
      });
      const items = [
        `<li>Total<strong>${state.tasks.length}</strong></li>`,
        ...STATUSES.map((s) => `<li>${escapeHtml(s.key)}<strong>${counts[s.key]}</strong></li>`),
        `<li class="summary-overdue"><span aria-hidden="true">⚠ </span>Overdue<strong>${overdue}</strong></li>`,
      ];
      document.getElementById("summary").innerHTML = items.join("");
    }

    function renderBoard() {
      const visible = applyFilters(state.tasks);
      const board = document.getElementById("board");

      board.innerHTML = STATUSES.map((s) => {
        const tasks = visible.filter((t) => t.status === s.key);
        const colId = "col-" + slug(s.key);
        return `
          <section class="column" data-status="${escapeHtml(s.key)}" aria-labelledby="${colId}">
            <div class="column-header">
              <h2 id="${colId}">${escapeHtml(s.key)}</h2>
              <span class="count-badge" aria-label="${tasks.length} tasks">${tasks.length}</span>
            </div>
            <p class="column-desc">${escapeHtml(s.desc)}</p>
            <div class="card-list">
              ${tasks.length ? tasks.map(renderCard).join("") : `<p class="empty">No tasks</p>`}
            </div>
          </section>`;
      }).join("");

      renderSummary();

      document.getElementById("filter-status").textContent = hasActiveFilters()
        ? `Showing ${visible.length} of ${state.tasks.length} tasks`
        : "";

      restoreFocus();
    }

    // Re-render replaces the DOM, so put keyboard focus back where the user expects it.
    function restoreFocus() {
      const target = state.ui.focusAfterRender;
      state.ui.focusAfterRender = null;
      if (!target) return;
      const card = document.querySelector(`.card[data-id="${CSS.escape(target.id)}"]`);
      const el = card && (card.querySelector(`[data-action="${target.action}"]`) || card.querySelector("[data-action]"));
      if (el) el.focus();
      else document.getElementById("open-add").focus();
    }

    /* =========================================================
       State mutations: each one re-renders from state
       ========================================================= */
    function addTask(data) {
      const task = { id: formatId(state.nextId++), ...data };
      state.tasks.push(task);
      renderBoard();
      return task;
    }

    function moveTask(id, status) {
      const task = state.tasks.find((t) => t.id === id);
      if (!task || task.status === status) return;
      task.status = status;
      state.ui.openMoveId = null;
      state.ui.pendingDeleteId = null;
      renderBoard();
      showToast(`${id} moved to ${status}`, "info");
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter((t) => t.id !== id);
      state.ui.pendingDeleteId = null;
      if (state.ui.openMoveId === id) state.ui.openMoveId = null;
      renderBoard();
      showToast(`${id} deleted`, "info");
    }

    /* =========================================================
       Toasts
       ========================================================= */
    function showToast(message, type = "success", duration = 4500) {
      const region = document.getElementById("toasts");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.setAttribute("role", type === "warning" ? "alert" : "status");
      toast.textContent = message;
      region.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }

    /* =========================================================
       FormSubmit notification (AJAX JSON endpoint)
       ========================================================= */
    async function notifyNewTask(task) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), NOTIFY_TIMEOUT_MS);
      try {
        const res = await fetch(FORMSUBMIT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
            _template: "table",
            _captcha: "false",
            "Task ID": task.id,
            Title: task.title,
            Description: task.description,
            Project: task.project,
            Category: task.category,
            Assignee: task.assignee,
            Priority: task.priority,
            "Due Date": task.dueDate,
            Status: task.status,
            "Submitted At": new Date().toISOString(),
          }),
        });
        if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
        const data = await res.json();
        // FormSubmit can answer 200 with { success: "false" }, e.g. before activation.
        if (String(data.success) === "false") throw new Error(`FormSubmit rejected: ${data.message || "unknown"}`);
        return data;
      } finally {
        clearTimeout(timer);
      }
    }

    /* =========================================================
       Add Task form: validation and submit
       ========================================================= */
    const form = document.getElementById("add-form");
    const submitBtn = document.getElementById("submit-add");

    function setFieldError(name, message) {
      const input = document.getElementById("f-" + name);
      const error = document.getElementById("f-" + name + "-error");
      error.textContent = message || "";
      if (message) input.setAttribute("aria-invalid", "true");
      else input.removeAttribute("aria-invalid");
    }

    function clearFormErrors() {
      ["title", "description", "project", "category", "assignee", "dueDate"].forEach((n) => setFieldError(n, ""));
    }

    function readForm() {
      const fd = new FormData(form);
      return {
        title: String(fd.get("title") || "").trim(),
        description: String(fd.get("description") || "").trim(),
        project: String(fd.get("project") || ""),
        category: String(fd.get("category") || ""),
        assignee: String(fd.get("assignee") || "").trim(),
        priority: String(fd.get("priority") || "Medium"),
        dueDate: String(fd.get("dueDate") || ""),
        status: String(fd.get("status") || "Backlog"),
      };
    }

    // Returns an object of { fieldName: message } for every invalid field.
    function validateForm(data) {
      const errors = {};
      if (!data.title) errors.title = "Task title is required.";
      else if (data.title.length > 80) errors.title = "Task title must be 80 characters or fewer.";
      if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
      if (!PROJECTS.includes(data.project)) errors.project = "Choose a project / workstream.";
      if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
      if (!data.assignee) errors.assignee = "Assignee is required.";
      if (!data.dueDate) errors.dueDate = "Due date is required.";
      else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
      else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";
      return errors;
    }

    function setSending(isSending) {
      state.sending = isSending;
      submitBtn.disabled = isSending;
      submitBtn.textContent = isSending ? "Sending…" : "Add Task";
    }

    async function handleSubmit(event) {
      event.preventDefault();
      if (state.sending) return;

      const data = readForm();
      const errors = validateForm(data);
      clearFormErrors();
      const invalid = Object.keys(errors);
      if (invalid.length) {
        invalid.forEach((name) => setFieldError(name, errors[name]));
        document.getElementById("f-" + invalid[0]).focus();
        return;
      }

      // Optimistic UI: the card appears immediately; the email goes out in parallel.
      const task = addTask(data);
      resetForm();
      closeModal();
      showToast(`${task.id} added to ${task.status}`, "success");

      setSending(true);
      try {
        await notifyNewTask(task);
      } catch (err) {
        console.warn(err);
        showToast("Card added locally — email notification failed", "warning", 6500);
      } finally {
        setSending(false);
      }
    }

    function resetForm() {
      form.reset();
      clearFormErrors();
      document.getElementById("f-priority").value = "Medium";
      document.getElementById("f-status").value = "Backlog";
    }

    /* =========================================================
       Modal open / close (focus kept inside while open)
       ========================================================= */
    const modal = document.getElementById("add-modal");
    const openBtn = document.getElementById("open-add");

    function openModal() {
      document.getElementById("f-dueDate").min = todayISO();
      modal.hidden = false;
      document.getElementById("f-title").focus();
    }

    function closeModal() {
      modal.hidden = true;
      openBtn.focus();
    }

    function trapFocus(event) {
      if (event.key !== "Tab") return;
      const focusables = modal.querySelectorAll("button:not([disabled]), input, select, textarea");
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }

    /* =========================================================
       Board events: card clicks (delegated) and drag & drop
       ========================================================= */
    function handleBoardClick(event) {
      const btn = event.target.closest("[data-action]");
      if (!btn) return;
      const card = btn.closest(".card");
      if (!card) return;
      const id = card.dataset.id;

      switch (btn.dataset.action) {
        case "toggle-move":
          state.ui.openMoveId = state.ui.openMoveId === id ? null : id;
          state.ui.pendingDeleteId = null;
          state.ui.focusAfterRender = { id, action: state.ui.openMoveId ? "move" : "toggle-move" };
          renderBoard();
          break;
        case "close-move":
          state.ui.openMoveId = null;
          state.ui.focusAfterRender = { id, action: "toggle-move" };
          renderBoard();
          break;
        case "move":
          state.ui.focusAfterRender = { id, action: "toggle-move" };
          moveTask(id, btn.dataset.status);
          break;
        case "delete":
          state.ui.pendingDeleteId = id;
          state.ui.openMoveId = null;
          state.ui.focusAfterRender = { id, action: "cancel-delete" };
          renderBoard();
          break;
        case "cancel-delete":
          state.ui.pendingDeleteId = null;
          state.ui.focusAfterRender = { id, action: "delete" };
          renderBoard();
          break;
        case "confirm-delete":
          deleteTask(id);
          break;
      }
    }

    function clearDropTargets() {
      document.querySelectorAll(".column.drop-target").forEach((c) => c.classList.remove("drop-target"));
    }

    function handleDragStart(event) {
      const card = event.target.closest && event.target.closest(".card");
      if (!card) return;
      event.dataTransfer.setData("text/plain", card.dataset.id);
      event.dataTransfer.effectAllowed = "move";
      card.classList.add("dragging");
    }

    function handleDragOver(event) {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      if (!column.classList.contains("drop-target")) {
        clearDropTargets();
        column.classList.add("drop-target");
      }
    }

    function handleDragLeave(event) {
      const column = event.target.closest(".column");
      if (column && !column.contains(event.relatedTarget)) column.classList.remove("drop-target");
    }

    function handleDrop(event) {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      clearDropTargets();
      const id = event.dataTransfer.getData("text/plain");
      if (id) moveTask(id, column.dataset.status);
    }

    function handleDragEnd() {
      clearDropTargets();
      document.querySelectorAll(".card.dragging").forEach((c) => c.classList.remove("dragging"));
    }

    /* =========================================================
       Filter events
       ========================================================= */
    function bindFilters() {
      const project = document.getElementById("filter-project");
      const assignee = document.getElementById("filter-assignee");
      const priority = document.getElementById("filter-priority");

      project.addEventListener("change", () => { state.filters.project = project.value; renderBoard(); });
      priority.addEventListener("change", () => { state.filters.priority = priority.value; renderBoard(); });
      assignee.addEventListener("input", () => { state.filters.assignee = assignee.value; renderBoard(); });

      document.getElementById("clear-filters").addEventListener("click", () => {
        state.filters = { project: "", assignee: "", priority: "" };
        project.value = "";
        assignee.value = "";
        priority.value = "";
        renderBoard();
      });
    }

    /* =========================================================
       Init
       ========================================================= */
    function init() {
      appendOptions(document.getElementById("filter-project"), PROJECTS);
      appendOptions(document.getElementById("filter-priority"), PRIORITIES);
      fillSelect(document.getElementById("f-project"), PROJECTS, PROJECTS[0]);
      fillSelect(document.getElementById("f-category"), CATEGORIES, CATEGORIES[0]);
      fillSelect(document.getElementById("f-priority"), PRIORITIES, "Medium");
      fillSelect(document.getElementById("f-status"), STATUSES.map((s) => s.key), "Backlog");

      const board = document.getElementById("board");
      board.addEventListener("click", handleBoardClick);
      board.addEventListener("dragstart", handleDragStart);
      board.addEventListener("dragover", handleDragOver);
      board.addEventListener("dragleave", handleDragLeave);
      board.addEventListener("drop", handleDrop);
      board.addEventListener("dragend", handleDragEnd);

      openBtn.addEventListener("click", openModal);
      document.getElementById("close-add").addEventListener("click", closeModal);
      document.getElementById("cancel-add").addEventListener("click", () => { resetForm(); closeModal(); });
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
      modal.addEventListener("keydown", trapFocus);
      form.addEventListener("submit", handleSubmit);

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (!modal.hidden) { closeModal(); return; }
        if (state.ui.openMoveId || state.ui.pendingDeleteId) {
          const id = state.ui.openMoveId || state.ui.pendingDeleteId;
          state.ui.focusAfterRender = { id, action: state.ui.openMoveId ? "toggle-move" : "delete" };
          state.ui.openMoveId = null;
          state.ui.pendingDeleteId = null;
          renderBoard();
        }
      });

      bindFilters();
      seedTasks();
      renderBoard();
    }

    init();
  </script>
</body>
</html>
